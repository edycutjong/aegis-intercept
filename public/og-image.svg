<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#06b6d4" stroke-width="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Decorative data streams (right side) -->
  <g opacity="0.15" filter="url(#bigGlow)">
    <line x1="800" y1="100" x2="1150" y2="100" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="850" y1="180" x2="1100" y2="180" stroke="#3b82f6" stroke-width="1"/>
    <line x1="820" y1="260" x2="1180" y2="260" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="870" y1="340" x2="1120" y2="340" stroke="#3b82f6" stroke-width="1"/>
    <line x1="810" y1="420" x2="1160" y2="420" stroke="#06b6d4" stroke-width="1"/>
    <line x1="860" y1="500" x2="1140" y2="500" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- Data nodes -->
  <g fill="#06b6d4" opacity="0.3">
    <circle cx="900" cy="150" r="3"/><circle cx="950" cy="220" r="4"/>
    <circle cx="1030" cy="180" r="3"/><circle cx="980" cy="310" r="5"/>
    <circle cx="1080" cy="280" r="3"/><circle cx="920" cy="400" r="4"/>
    <circle cx="1050" cy="450" r="3"/><circle cx="1100" cy="370" r="4"/>
  </g>

  <!-- Shield icon (left area) -->
  <g transform="translate(120, 160) scale(0.6)" filter="url(#glow)">
    <path d="M256 80 L400 160 L400 300 Q400 420 256 460 Q112 420 112 300 L112 160 Z"
          fill="none" stroke="url(#sg)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M256 110 L375 178 L375 295 Q375 395 256 430 Q137 395 137 295 L137 178 Z"
          fill="url(#sg)" fill-opacity="0.1"/>
    <line x1="190" y1="270" x2="322" y2="270" stroke="#06b6d4" stroke-width="2.5" opacity="0.6"/>
    <line x1="256" y1="204" x2="256" y2="336" stroke="#06b6d4" stroke-width="2.5" opacity="0.6"/>
    <circle cx="256" cy="270" r="14" fill="#ef4444" opacity="0.9"/>
    <circle cx="256" cy="270" r="22" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Title -->
  <text x="480" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#f1f5f9" letter-spacing="-1">AEGIS</text>
  <text x="480" y="330" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="300" fill="#64748b" letter-spacing="8">INTERCEPT</text>

  <!-- Subtitle -->
  <text x="480" y="400" font-family="monospace" font-size="16" fill="#06b6d4" opacity="0.8" letter-spacing="2">REAL-TIME CROSS-CHAIN EXPLOIT DETECTION</text>

  <!-- Bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="#ef4444" opacity="0.15"/>
  <rect x="0" y="615" width="400" height="15" fill="#ef4444" opacity="0.3"/>

  <!-- Tech labels -->
  <g font-family="monospace" font-size="11" fill="#475569" letter-spacing="1">
    <text x="480" y="460">LIQUIFY INDEXER API</text>
    <text x="480" y="480">POWERED BY SUPABASE REALTIME</text>
  </g>
</svg>
